name: Price-book AI verification
on:
  push:
    branches: [codex/pricebook-ai-20261001]
permissions:
  contents: read
concurrency:
  group: pricebook-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Cold dependencies
        run: rm -rf node_modules server/node_modules client/node_modules && npm ci --no-audit --no-fund
      - name: Isolated browser
        run: |
          npm --prefix "$RUNNER_TEMP/ai-browser" install --no-save --package-lock=false playwright@1.56.0
          "$RUNNER_TEMP/ai-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build owner app and widget
        run: npm --prefix client run build
      - name: Focused AI and customer-summary regressions
        run: node --test test/priceBookAI.spec.mjs
      - name: Real Gemini and application browser verification
        env:
          AI_BROWSER_MODULE: ${{ runner.temp }}/ai-browser/node_modules/playwright
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_ENABLED: 'false'
          VOICE_RUNTIME_ENABLED: 'false'
          STRIPE_BILLING_ENABLED: 'false'
          EMAIL_DELIVERY_ENABLED: 'false'
          OUTBOUND_WEBHOOKS_ENABLED: 'false'
        run: |
          mkdir -p .portable-runtime/node-v22.23.2-win-x64
          cp "$(command -v node)" .portable-runtime/node-v22.23.2-win-x64/node.exe
          chmod +x .portable-runtime/node-v22.23.2-win-x64/node.exe
          .portable-runtime/node-v22.23.2-win-x64/node.exe verification/pricebook-ai/verify.mjs "$RUNNER_TEMP/ai-verification"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricebook-ai-${{ github.sha }}
          path: ${{ runner.temp }}/ai-verification/public/
          if-no-files-found: error
          retention-days: 30

name: Phase 0-2 branch regression

on:
  push:
    branches:
      - claude/phase-2-audit-fixes
  pull_request:
    branches:
      - claude/phase-2-audit-fixes

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci
          status=$?
          echo "NPM_CI_EXIT_STATUS=$status"
          exit "$status"
      - name: Phase 0 gate
        shell: bash
        run: |
          set +e
          npm run gate:0
          status=$?
          echo "PHASE_0_EXIT_STATUS=$status"
          exit "$status"
      - name: Phase 1 gate
        shell: bash
        run: |
          set +e
          npm run gate:1
          status=$?
          echo "PHASE_1_EXIT_STATUS=$status"
          exit "$status"
      - name: Phase 2 gate and production client build
        shell: bash
        run: |
          set +e
          npm run gate:2
          status=$?
          echo "PHASE_2_EXIT_STATUS=$status"
          exit "$status"

name: Widget embed verification

on:
  push:
    branches: [codex/widget-embed-20261001]

permissions:
  contents: read

concurrency:
  group: widget-embed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install locked dependencies in a cold checkout
        run: |
          rm -rf node_modules server/node_modules client/node_modules
          npm ci --no-audit --no-fund
      - name: Install isolated browser
        run: |
          npm --prefix "$RUNNER_TEMP/widget-browser" install --no-save --package-lock=false playwright@1.56.0
          "$RUNNER_TEMP/widget-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build owner application and widget
        run: npm --prefix client run build
      - name: Focused widget transport and retry regressions
        run: node --test client/test/widget-transport.test.mjs test/widgetEmbed.spec.mjs
      - name: Exercise separate-origin contractor website
        env:
          WIDGET_BROWSER_MODULE: ${{ runner.temp }}/widget-browser/node_modules/playwright
          WIDGET_SOURCE_SHA: ${{ github.sha }}
          ALLOW_PROVIDER_WRITES: 'false'
          VOICE_ENABLED: 'false'
          BILLING_ENABLED: 'false'
          DEMO_ENABLED: 'false'
        run: |
          mkdir -p .portable-runtime/node-v22.23.2-win-x64
          cp "$(command -v node)" .portable-runtime/node-v22.23.2-win-x64/node.exe
          chmod +x .portable-runtime/node-v22.23.2-win-x64/node.exe
          .portable-runtime/node-v22.23.2-win-x64/node.exe verification/widget-embed/browser.mjs . "$RUNNER_TEMP/widget-evidence"
      - name: Upload synthetic evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-embed-${{ github.sha }}
          path: ${{ runner.temp }}/widget-evidence/public/
          if-no-files-found: error
          retention-days: 30

    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/release-candidate-20261013m' && needs.test.result == 'success' && needs.voice-docker-startup.result == 'success'
    needs: [test, voice-docker-startup]
    permissions:
      contents: write

name: CI
on:
  push:
    branches: ['main', 'claude/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install from lockfile (ignores committed node_modules)
        run: rm -rf node_modules server/node_modules client/node_modules && npm ci --no-audit --no-fund
      - name: Full test suite
        run: node --test test/*.spec.js test/*.spec.mjs > test-results.tap 2>&1 || true
      - name: No failures beyond the known list
        run: node .github/scripts/check-test-results.mjs test-results.tap
      - name: Build owner app and widget
        run: npm --prefix client run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

name: CI
on:
  push:
    branches: ['main', 'claude/**', 'codex/**']
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install from lockfile (ignores committed node_modules)
        run: rm -rf node_modules server/node_modules client/node_modules && npm ci --no-audit --no-fund
      - name: Browser for the two browser test files (Playwright is not a project dependency; installed without touching the lockfile)
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Build owner app and widget
        run: npm --prefix client run build
      - name: Full test suite
        run: node --test test/*.spec.js test/*.spec.mjs > test-results.tap 2>&1 || true
      - name: No failures beyond the known list
        run: node .github/scripts/check-test-results.mjs test-results.tap | tee test-check.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish test summary to claude/ci-results (push events only; never fails the build)
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          name="$(echo "${GITHUB_REF_NAME}" | tr '/' '_').txt"
          { echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}"; cat test-check.txt 2>/dev/null; grep -E '^not ok ' test-results.tap 2>/dev/null; } > "/tmp/$name"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/ci && git clone -q --depth 1 --branch claude/ci-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ci || exit 0
            cp "/tmp/$name" "/tmp/ci/$name" && cd /tmp/ci && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
            git add "$name" && { git diff --cached --quiet || git commit -q -m "CI ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"; }
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/ci-results && exit 0
            cd "$GITHUB_WORKSPACE"; sleep $((attempt * 3))
          done
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

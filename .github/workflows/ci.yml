      - name: Verify every exact-SHA required step and publish immutable candidate-n tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f verification/release-candidate-20261014n/FINAL_CANDIDATE.json ]; then
            echo 'Diagnostic checkpoint: no final-candidate marker; no tag authorized.'
            exit 0
          fi
          node verification/release-candidate-20261014n/check-release-gate.mjs

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify every exact-SHA required step and publish immutable candidate-m tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f verification/release-candidate-20261013/FINAL_CANDIDATE.json ]; then

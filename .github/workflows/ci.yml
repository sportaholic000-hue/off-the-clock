name: CI
on:
  push:
    branches: ['main', 'claude/**', 'codex/**', 'fix/voice-quote-path-v2-20261006', 'feat/website-price-import-20261006', 'feat/no-sms-email-quotes', 'fix/quote-display-defects-20261006', 'feat/overage-and-minute-alerts-20261006', 'fix/voice-lifecycle-20261006', 'fix/caller-history-followup-20261006', 'fix/booking-calendar-20261006', 'verify/backup-restore-rehearsal-20261006', 'feat/billing-lifecycle-20261007', 'fix/tenant-isolation-20261007', 'fix/engine-leftovers', 'fix/voice-core', 'fix/voice-limits', 'fix/owner-dashboard']
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install from lockfile (ignores committed node_modules)
        run: rm -rf node_modules server/node_modules client/node_modules && npm ci
      - name: Install Playwright test dependency without changing the lockfile
        timeout-minutes: 5
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium for the browser tests
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify Chromium can launch; install system libraries if needed
        timeout-minutes: 5
        shell: bash
        run: |
          probe='import {chromium} from "playwright"; const browser=await chromium.launch({headless:true,args:["--no-sandbox"]}); await browser.close();'
          if ! node --input-type=module -e "$probe"; then
            npx playwright install-deps chromium
            node --input-type=module -e "$probe"
          fi
      - name: Build owner app and widget
        run: npm run build
      - name: Owner dashboard browser regression
        run: node --test test/ownerDashboard20261007.browser.spec.mjs
      - name: Strict quote engine and price book gate
        run: npm run test:quote
      - name: Full test suite
        run: npm test
      - name: No failures beyond the known list
        run: node .github/scripts/check-test-results.mjs test-results.tap | tee test-check.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish test summary to claude/ci-results (push events only)
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git clone -q --depth 1 --branch claude/ci-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" . 2>/dev/null || { git init -q && git checkout -q -b claude/ci-results; }
          name="$(echo "${GITHUB_REF_NAME}" | tr '/' '_').txt"
          { echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}"; cat "$GITHUB_WORKSPACE/test-check.txt" 2>/dev/null; awk '/^not ok /' "$GITHUB_WORKSPACE/test-results.tap"; } > "$name"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add "$name" && git commit -q -m "CI ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" && git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/ci-results || true
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

name: CI
on:
  push:
    branches: ['fix/owner-qe-008-013-016-20261015', 'fix/qe-015-choice-cap-20261015', 'fix/lock-recovery-race-20261011', 'fix/retention-hardening-20261011', 'fix/billing-staff-scan-20261011', 'fix/day90-erasure-20261011', 'main', 'claude/**', 'codex/**', 'fix/voice-quote-path-v2-20261006', 'feat/website-price-import-20261006', 'feat/no-sms-email-quotes', 'fix/quote-display-defects-20261006', 'feat/overage-and-minute-alerts-20261006', 'fix/voice-lifecycle-20261006', 'fix/caller-history-followup-20261006', 'fix/booking-calendar-20261006', 'verify/backup-restore-rehearsal-20261006', 'feat/billing-lifecycle-20261007', 'fix/tenant-isolation-20261007', 'fix/engine-leftovers', 'fix/voice-core', 'fix/voice-limits', 'fix/owner-dashboard', 'fix/billing-backup-leftovers', 'fix/receptionist-20261008', 'fix/demo-facts-scanner-20261011']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: write # Existing ci-results summary branch publication.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install from lockfile (ignores committed node_modules)
        id: install
        run: rm -rf node_modules server/node_modules client/node_modules && npm ci
      - name: Install Playwright test dependency without changing the lockfile
        timeout-minutes: 5
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: Install Chromium for the browser tests
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify Chromium can launch; install system libraries if needed
        timeout-minutes: 5
        shell: bash
        run: |
          probe='import {chromium} from "playwright"; const browser=await chromium.launch({headless:true,args:["--no-sandbox"]}); await browser.close();'
          if ! node --input-type=module -e "$probe"; then
            npx playwright install-deps chromium
            node --input-type=module -e "$probe"
          fi
      - name: Build owner app and widget
        id: build
        run: npm run build
      - name: Candidate l controlled owner-alert browser reproduction
        if: github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node --test verification/release-candidate-20261012l/reproduce-owner-alert.browser.mjs
      - name: Owner alerts and dashboard browser regressions
        id: browser
        run: node --test test/ownerAlertRepair20261006.browser.spec.mjs test/ownerAlertsDelivery20261006.browser.spec.mjs test/ownerDashboard20261007.browser.spec.mjs
      - name: Candidate l harness and CI safety regressions
        if: github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node --test test/ownerAlertScheduling20261012Http.spec.mjs test/ciSummary20261012.spec.mjs test/candidateLTagGate20261012.spec.mjs
      - name: Candidate l shared HTTP fixture consumers and alert worker regressions
        if: github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: |
          node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test \
            test/callerHistoryFollowup20261006Http.spec.mjs \
            test/leadCaptureRepair20261006Http.spec.mjs \
            test/ownerAlertRepair20261006Http.spec.mjs \
            test/ownerAlertsDelivery20261006Http.spec.mjs \
            test/ownerDashboard20261007TenantHttp.spec.mjs \
            test/ownerIntegrations.spec.mjs \
            test/ownerAlertRepair20261006.spec.mjs
          node --test test/leadCaptureRepair20261006.browser.spec.mjs
      - name: Candidate m runner and tag qualification regressions
        if: github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap test/ciRunnerRepair20261013.spec.mjs test/candidateMTagGate20261013.spec.mjs
      - name: Candidate n booking repair and tag qualification regressions
        if: github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap test/bookingServiceEnd20261014.spec.mjs test/candidateNTagGate20261014.spec.mjs
      - name: Strict quote engine and price book gate
        id: quote_gate
        run: npm run test:quote
      - name: Full test suite
        run: npm test
        id: full_suite
      - name: Candidate h standalone regressions (each file independently)
        if: github.ref == 'refs/heads/claude/release-candidate-20261011h'
        shell: bash
        run: |
          for spec in \
            test/day90Backups20261011.spec.mjs \
            test/day90Cancellation20261011.spec.mjs \
            test/day90Guarantees20261011.spec.mjs \
            test/day90Providers20261011.spec.mjs \
            test/tenantRetention20261010.spec.mjs \
            test/billingTrial20261011.dom.spec.mjs \
            test/staffLogin20261009.spec.mjs \
            test/ownerQueryCoverage20261009.spec.mjs \
            test/continuousOffsite20261007.spec.mjs \
            test/ownerWording20261011.dom.spec.mjs \
            test/pricebookFirstVisit20261009.dom.spec.mjs \
            test/tenantIsolationRoutes.spec.mjs; do
            echo "Standalone: $spec"
            node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test "$spec"
          done
      - name: Candidate i standalone regressions (each file independently)
        if: github.ref == 'refs/heads/claude/release-candidate-20261011i'
        shell: bash
        run: |
          for spec in \
            test/retentionHardening*.spec.mjs \
            test/day90*.spec.mjs \
            test/tenantRetention20261010.spec.mjs \
            test/continuousOffsite20261007.spec.mjs \
            test/backups.spec.mjs \
            test/offsiteBackups20261007.spec.mjs \
            test/ownerQueryCoverage20261009.spec.mjs \
            test/voiceLimits20261007.spec.mjs \
            test/tenantIsolationRoutes.spec.mjs \
            test/billingTrial20261011.dom.spec.mjs \
            test/ownerWording20261011.dom.spec.mjs \
            test/staffLogin20261009.spec.mjs; do
            echo "Standalone: $spec"
            node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap "$spec"
          done
      - name: Candidate i confirms required test names in the full-suite log
        if: github.ref == 'refs/heads/claude/release-candidate-20261011i' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261011i/check-required-test-names.mjs test-results.tap
      - name: Candidate k backup coordination regressions
        if: github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap test/backupCoordination20261012.spec.mjs
      - name: Candidate j and k standalone regressions (each file independently)
        if: github.ref == 'refs/heads/claude/release-candidate-20261011j' || github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        shell: bash
        run: |
          for spec in \
            test/lockRecoveryRace20261011.spec.mjs \
            test/lockDatabaseBackup20261011.spec.mjs \
            test/retentionHardening*.spec.mjs \
            test/day90*.spec.mjs \
            test/tenantRetention20261010.spec.mjs \
            test/continuousOffsite20261007.spec.mjs \
            test/backups.spec.mjs \
            test/offsiteBackups20261007.spec.mjs \
            test/backupRestoreRehearsal.spec.mjs \
            test/ownerQueryCoverage20261009.spec.mjs \
            test/tenantIsolationRoutes.spec.mjs; do
            echo "Standalone: $spec"
            node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap "$spec"
          done
      - name: Candidate j and k confirm required lock test names in the full-suite log
        if: github.ref == 'refs/heads/claude/release-candidate-20261011j' || github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261011j/check-required-test-names.mjs test-results.tap
      - name: Candidate k confirms coordination test names in the full-suite log
        if: github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261012k/check-required-test-names.mjs test-results.tap
      - name: Candidate l expiry regressions and required passing names
        if: github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: |
          node --experimental-test-module-mocks --import ./test/pricebookTestEnv.mjs --test --test-reporter=tap test/retentionExpiry20261012.spec.mjs
          node verification/release-candidate-20261012l/check-required-test-names.mjs test-results.tap
      - name: Candidate l follow-up required passing names
        if: github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261012l/check-followup-test-names.mjs test-results.tap
      - name: Candidate m confirms every CI-runner regression passed
        if: github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261013/check-required-test-names.mjs test-results.tap
      - name: Candidate n confirms every booking service-end regression passed
        if: github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/release-candidate-20261014n/check-required-test-names.mjs test-results.tap
      - name: No failures beyond the known list
        id: test_checker
        run: node .github/scripts/check-test-results.mjs test-results.tap | tee test-check.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Publish test summary to claude/ci-results (push events only)
        if: always() && github.event_name == 'push'
        env:
          CHECKER_OUTCOME: ${{ steps.test_checker.outcome }}
          SUITE_OUTCOME: ${{ steps.full_suite.outcome }}
          PRIOR_GATES: "install=${{ steps.install.outcome }}; build=${{ steps.build.outcome }}; browser=${{ steps.browser.outcome }}; quote=${{ steps.quote_gate.outcome }}"
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git clone -q --depth 1 --branch claude/ci-results "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" . 2>/dev/null || { git init -q && git checkout -q -b claude/ci-results; }
          name="$(echo "${GITHUB_REF_NAME}" | tr '/' '_').txt"
          node "$GITHUB_WORKSPACE/verification/release-candidate-20261012l/render-test-summary.mjs" > "$name"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add "$name"
          if ! git diff --cached --quiet; then
            git commit -q -m "CI ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          fi
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/ci-results
          echo 'Test summary publication completed.'
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  voice-docker-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build production runtime image
        run: docker build --tag otc-receptionist:synthetic .
      - name: Voice enabled with synthetic credentials and no provider network
        run: node verification/receptionist-20261008/docker-voice-smoke.mjs otc-receptionist:synthetic
      - name: Candidate h Railway restart, redeploy, SIGTERM and restore smoke
        if: github.ref == 'refs/heads/claude/release-candidate-20261011h'
        run: node verification/railway/docker-smoke.mjs otc-receptionist:synthetic
      - name: Candidate i Railway restart, redeploy, SIGTERM and restore smoke
        if: github.ref == 'refs/heads/claude/release-candidate-20261011i'
        run: node verification/railway/docker-smoke.mjs otc-receptionist:synthetic
      - name: Candidate j and k Railway restart, redeploy, SIGTERM and restore smoke
        if: github.ref == 'refs/heads/claude/release-candidate-20261011j' || github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/railway/docker-smoke.mjs otc-receptionist:synthetic
      - name: Candidate j and k production-user lock database proof
        if: github.ref == 'refs/heads/claude/release-candidate-20261011j' || github.ref == 'refs/heads/claude/release-candidate-20261012k' || github.ref == 'refs/heads/claude/release-candidate-20261012l' || github.ref == 'refs/heads/claude/release-candidate-20261013m' || github.ref == 'refs/heads/claude/release-candidate-20261014n'
        run: node verification/railway/lock-database-smoke.mjs otc-receptionist:synthetic

  tag-candidate-h:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/release-candidate-20261011h'
    needs: [test, voice-docker-startup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tag only the final reviewed report commit, never replace a tag
        shell: bash
        run: |
          gate=verification/release-candidate-20261011h/RELEASE_GATE.json
          if [ ! -f "$gate" ]; then
            echo 'Checkpoint only: no release tag requested.'
            exit 0
          fi
          node verification/release-candidate-20261011h/check-release-gate.mjs
          test "$(git ls-remote origin refs/heads/claude/release-candidate-20261011h | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin refs/tags/rc-20261011h)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a rc-20261011h "$GITHUB_SHA" -m "Release candidate h; final report commit $GITHUB_SHA; required checks passed in CI run $GITHUB_RUN_ID."
          git push origin refs/tags/rc-20261011h
          git ls-remote origin refs/heads/claude/release-candidate-20261011h refs/tags/rc-20261011h 'refs/tags/rc-20261011h^{}'

  tag-candidate-i:
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/release-candidate-20261011i'
    needs: [test, voice-docker-startup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tag only the final reviewed report commit, never replace a tag

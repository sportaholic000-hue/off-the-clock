            exit 0
          fi
          node verification/release-candidate-20261013/check-release-gate.mjs

  tag-candidate-n:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/release-candidate-20261014n' && needs.test.result == 'success' && needs.voice-docker-startup.result == 'success'
